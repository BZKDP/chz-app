<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Честный Знак — расширенный режим</title>
<style>
  :root { --bg:#0f1419; --panel:#171e26; --line:#26313d; --ink:#e6edf3; --mut:#8b98a5; --acc:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  .env { font-size:11px; padding:2px 8px; border-radius:10px; background:#3b2f10; color:var(--warn); border:1px solid #5a4718; }
  nav { display:flex; gap:4px; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav button { background:none; border:1px solid transparent; color:var(--mut); padding:7px 14px; border-radius:8px; cursor:pointer; font-size:13px; }
  nav button.active { background:var(--panel); color:var(--ink); border-color:var(--line); }
  main { padding:20px; max-width:1000px; margin:0 auto; }
  .tab { display:none; } .tab.active { display:block; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .card h2 { margin:0 0 12px; font-size:14px; font-weight:600; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  label { font-size:12px; color:var(--mut); display:block; margin-bottom:4px; }
  input, select, textarea { background:#0d1218; border:1px solid var(--line); color:var(--ink); padding:8px 10px; border-radius:8px; font-size:13px; color-scheme:dark; }
  input:focus, select:focus { outline:none; border-color:var(--acc); }
  button.act { background:var(--acc); border:none; color:#fff; padding:9px 16px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:500; }
  button.act:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:none; border:1px solid var(--line); color:var(--ink); padding:7px 12px; border-radius:8px; cursor:pointer; font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:500; font-size:11px; text-transform:uppercase; }
  .pill { font-size:11px; padding:2px 8px; border-radius:10px; border:1px solid var(--line); }
  .pill.ok { color:var(--ok); border-color:#1c4a2e; background:#0e2417; }
  .pill.warn { color:var(--warn); border-color:#5a4718; background:#241a08; }
  .pill.err { color:var(--err); border-color:#5a1d1d; background:#240e0e; }
  .mut { color:var(--mut); }
  .mono { font-family:ui-monospace,Consolas,monospace; font-size:12px; word-break:break-all; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .progress { height:6px; background:#0d1218; border-radius:4px; overflow:hidden; margin-top:8px; }
  .progress > i { display:block; height:100%; width:0; background:var(--acc); transition:width .3s; }
  .steps { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; font-size:11px; }
  .steps span { padding:2px 8px; border-radius:8px; border:1px solid var(--line); color:var(--mut); }
  .steps span.done { color:var(--ok); border-color:#1c4a2e; }
  .steps span.cur { color:var(--acc); border-color:var(--acc); }
  .dm-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .dm-grid figure { margin:0; background:#fff; border-radius:8px; padding:8px; text-align:center; }
  .dm-grid img { width:100%; image-rendering:pixelated; }
  .dm-grid figcaption { font-size:10px; color:#333; margin-top:4px; word-break:break-all; }
  .big { font-size:22px; font-weight:600; }
  .kpi { display:flex; gap:24px; flex-wrap:wrap; }
  .kpi > div { min-width:150px; }
  .notice { font-size:12px; color:var(--mut); background:#0d1218; border:1px solid var(--line); border-radius:8px; padding:10px; }
  /* --- анимации --- */
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  @keyframes flash { from { background:#12324a; } to { background:var(--panel); } }
  .card { animation:fadeUp .28s ease both; }
  .tab.active { animation:fadeUp .2s ease both; }
  .spinner { width:13px; height:13px; border:2px solid var(--line); border-top-color:var(--acc); border-radius:50%; display:inline-block; animation:spin .7s linear infinite; vertical-align:-2px; }
  .pill.pending { animation:pulse 1.2s ease-in-out infinite; }
  .row.flash { animation:flash .8s ease; }
  nav button, button.act, button.ghost, .pill { transition:all .15s ease; }
  button.act:hover:not(:disabled) { filter:brightness(1.12); transform:translateY(-1px); }
  button.ghost:hover:not(:disabled) { border-color:var(--acc); color:#fff; }
  .steps span { transition:all .25s ease; }
  .steps span.cur { animation:pulse 1s ease-in-out infinite; }
  .dm-grid figure { animation:fadeUp .3s ease both; }
  .order-card { transition:border-color .3s ease; }
  .order-card.rej { border-color:#5a1d1d; }
  .order-card.ok { border-color:#1c4a2e; }
</style>
</head>
<body>
<header>
  <h1>Честный Знак — расширенный режим</h1>
  <span class="env" id="env">—</span>
  <span class="mut" id="omsLine"></span>
  <span style="margin-left:auto" class="row">
    <span class="dot" id="laptopDot" style="background:#555"></span>
    <span class="mut" id="laptopText">ноутбук…</span>
  </span>
</header>
<nav id="nav"></nav>
<main>
  <section class="tab" id="tab-status"></section>
  <section class="tab" id="tab-products"></section>
  <section class="tab" id="tab-order"></section>
  <section class="tab" id="tab-orders"></section>
  <section class="tab" id="tab-dropout"></section>
  <section class="tab" id="tab-money"></section>
</main>
<script src="legacy.js"></script>
</body>
</html>
